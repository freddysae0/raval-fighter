<html lang="es">
<head>
<meta charset="utf-8">

<title>Raval Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07060b;overflow:hidden;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  /* el juego dibuja su propia mira de pixel art en lugar del cursor del sistema */
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 0 1px #1a1424,0 0 60px #000;cursor:none;outline:none}
  #links{position:fixed;right:10px;bottom:10px;display:flex;gap:8px;z-index:5}
  #links a{font:8px 'Press Start 2P',monospace;color:#ffd84a;background:#141028;border:2px solid #e8dcc0;box-shadow:2px 2px 0 #000;padding:6px 8px;text-decoration:none;display:flex;align-items:center;gap:6px;image-rendering:pixelated}
  #links a:hover{background:#2a2050;color:#fff}
  #links svg{width:12px;height:12px;fill:currentColor}
</style>
</head>
<body>
<!-- Solo teclado y ratón, como la versión de Godot. Un clic en el juego le da el foco:
     dentro de un iframe, sin foco no llegan ni las teclas ni la rueda. -->
